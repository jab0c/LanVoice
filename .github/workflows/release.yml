name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install sounddevice pyinstaller

      - name: Build
        run: python build.py

      - name: Package Windows exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "dist/LANVoice.exe"
          if (!(Test-Path $exe)) {
            $exe = "dist/LAN Voice.exe"
          }
          if (!(Test-Path $exe)) {
            throw "Built exe not found in dist/"
          }
          Copy-Item $exe "LANVoice-windows.exe" -Force

      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          APP="dist/LAN Voice.app"
          if [ ! -d "$APP" ]; then
            APP=$(find dist -maxdepth 3 -name "*.app" -print -quit)
          fi
          if [ -z "$APP" ]; then
            echo "Built .app not found in dist/" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "LANVoice-macOS.zip"

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lanvoice-windows
          path: LANVoice-windows.exe

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lanvoice-macos
          path: LANVoice-macOS.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/LANVoice-windows.exe
            release-assets/**/LANVoice-macOS.zip
